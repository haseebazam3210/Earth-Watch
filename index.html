<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌍 EARTH WATCH | Global Weather Nexus</title>
  <!-- Google Fonts + Icons + Three.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* Canvas 3D background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* UI Overlay */
    .ui-overlay {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .weather-app {
      max-width: 650px;
      width: 100%;
      background: rgba(5, 12, 25, 0.65);
      backdrop-filter: blur(20px);
      border-radius: 64px;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      padding: 2rem 2rem 2.2rem;
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      border: 1px solid rgba(100, 200, 255, 0.3);
      pointer-events: auto;
      animation: cardFloat 3s infinite alternate;
    }
    @keyframes cardFloat {
      0% { transform: translateY(0px); box-shadow: 0 40px 70px rgba(0, 0, 0, 0.5); }
      100% { transform: translateY(-8px); box-shadow: 0 50px 80px rgba(0, 150, 255, 0.2); }
    }

    /* Header */
    .lux-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #A5F0FF, #7CFFB9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(100,255,200,0.3);
    }
    .logo i { color: #4effd5; margin-right: 8px; }

    .search-container {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 80px;
      padding: 5px 8px 5px 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 255, 200, 0.5);
      transition: all 0.3s;
    }
    .search-container input {
      background: transparent;
      border: none;
      font-size: 1rem;
      color: #fff;
      padding: 10px 0;
      width: 170px;
      outline: none;
      font-family: 'Inter', monospace;
    }
    .search-container input::placeholder { color: rgba(255,255,200,0.6); }
    .search-container button {
      background: linear-gradient(125deg, #00d4ff, #7c4dff);
      border: none;
      border-radius: 50px;
      width: 45px;
      height: 45px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .search-container button:hover { transform: scale(0.95); filter: brightness(1.1); }

    /* Current Weather */
    .weather-main {
      text-align: center;
      margin: 1rem 0;
    }
    .city-name {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFF, #aaffdd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .date-time {
      font-size: 0.8rem;
      background: rgba(0,0,0,0.4);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 40px;
      margin-top: 8px;
      backdrop-filter: blur(4px);
    }
    .temp-big {
      font-size: 5.8rem;
      font-weight: 800;
      background: linear-gradient(145deg, #FFFFFF, #88FFEE);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(0,255,200,0.3);
      animation: pulseTemp 2s infinite;
    }
    @keyframes pulseTemp {
      0% { opacity: 0.9; text-shadow: 0 0 10px cyan; }
      100% { opacity: 1; text-shadow: 0 0 30px #0ff; }
    }
    .weather-desc {
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #ccf4ff;
    }

    /* Details Grid */
    .weather-details {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem 0;
    }
    .detail-card {
      background: rgba(0, 20, 40, 0.6);
      backdrop-filter: blur(8px);
      flex: 1;
      padding: 1rem;
      border-radius: 30px;
      text-align: center;
      border: 1px solid rgba(0,255,200,0.3);
      transition: 0.3s;
    }
    .detail-card:hover { transform: translateY(-5px); background: rgba(0,40,70,0.8); border-color: #0ff; }
    .detail-card i { font-size: 1.8rem; color: #0ff; margin-bottom: 8px; }
    .detail-label { font-size: 0.7rem; text-transform: uppercase; color: #9df; }
    .detail-value { font-size: 1.3rem; font-weight: 700; color: #fff; }

    /* Forecast */
    .forecast-title {
      margin: 1rem 0;
      font-weight: 600;
      color: #aaffdd;
      border-left: 3px solid cyan;
      padding-left: 12px;
    }
    .forecast-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .forecast-day {
      background: rgba(0, 20, 40, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 28px;
      padding: 12px;
      min-width: 85px;
      text-align: center;
      border: 1px solid rgba(0,255,200,0.3);
      transition: 0.2s;
    }
    .forecast-day:hover { transform: translateY(-5px); border-color: cyan; }
    .forecast-icon { font-size: 1.8rem; margin: 8px 0; }
    .forecast-temp { font-weight: 700; color: #aaffee; }

    /* AQI & Extra Feature */
    .extra-feature {
      margin-top: 1rem;
      background: rgba(0,0,0,0.4);
      border-radius: 40px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      border: 1px solid rgba(0,255,200,0.3);
    }
    .aqi-badge {
      background: linear-gradient(135deg, #00b4ff, #0066cc);
      padding: 5px 12px;
      border-radius: 30px;
      font-weight: bold;
    }
    .global-tip {
      font-style: italic;
      color: #aaffdd;
    }
    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      opacity: 0.7;
    }
    .error-message {
      background: rgba(255,0,0,0.3);
      border-radius: 50px;
      padding: 10px;
      margin-top: 10px;
      text-align: center;
    }
    @media (max-width: 550px) {
      .weather-app { padding: 1.2rem; }
      .temp-big { font-size: 3.8rem; }
      .city-name { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui-overlay">
    <div class="weather-app">
      <div class="lux-header">
        <div class="logo"><i class="fas fa-globe-asia"></i> EARTH<span style="font-weight:300">/WATCH</span></div>
        <div class="search-container">
          <input type="text" id="cityInput" placeholder="Anywhere on Earth..." value="New York">
          <button id="searchBtn"><i class="fas fa-search-location"></i></button>
        </div>
      </div>
      <div class="weather-main" id="weatherMain"></div>
      <div class="forecast-title"><i class="fas fa-calendar-week"></i> 5-DAY FORECAST • GLOBAL</div>
      <div class="forecast-container" id="forecastContainer"></div>
      <div class="extra-feature" id="extraFeature">
        <span><i class="fas fa-leaf"></i> Air Quality Index</span>
        <span class="aqi-badge" id="aqiValue">Loading AQI...</span>
        <span class="global-tip"><i class="fas fa-satellite"></i> Live Satellite</span>
      </div>
      <div id="errorContainer"></div>
      <footer><i class="fas fa-dove"></i> Real-time Earth Weather • Every City • Animated Globe</footer>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    // --- 3D EARTH SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010118);
    scene.fog = new THREE.FogExp2(0x010118, 0.0008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.2);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Controls for interactive earth (auto-rotate but user can drag)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.zoomSpeed = 0.8;
    
    // Earth Texture (high-res)
    const textureLoader = new THREE.TextureLoader();
    const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    const earthNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    const cloudMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
    
    const earthGeometry = new THREE.SphereGeometry(1, 128, 128);
    const earthMaterial = new THREE.MeshPhongMaterial({
      map: earthMap,
      specularMap: earthSpecularMap,
      specular: new THREE.Color('grey'),
      shininess: 5,
      normalMap: earthNormalMap,
      normalScale: new THREE.Vector2(0.8, 0.8)
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);
    
    // Clouds layer
    const cloudGeometry = new THREE.SphereGeometry(1.01, 128, 128);
    const cloudMaterial = new THREE.MeshPhongMaterial({
      map: cloudMap,
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending
    });
    const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
    scene.add(clouds);
    
    // Stars background (particle system)
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 3000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i*3] = (Math.random() - 0.5) * 2000;
      starPositions[i*3+1] = (Math.random() - 0.5) * 2000;
      starPositions[i*3+2] = (Math.random() - 0.5) * 500 - 100;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.7 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 3, 5);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0x4466cc, 0.4);
    backLight.position.set(-2, -1, -3);
    scene.add(backLight);
    
    // Animation loop
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // auto-rotate enabled
      clouds.rotation.y += 0.0008;
      stars.rotation.y += 0.0002;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // --- WEATHER LOGIC (Global API) ---
    const weatherMain = document.getElementById('weatherMain');
    const forecastContainer = document.getElementById('forecastContainer');
    const errorContainer = document.getElementById('errorContainer');
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const aqiSpan = document.getElementById('aqiValue');
    
    function showError(msg) {
      errorContainer.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${msg}</div>`;
      setTimeout(() => errorContainer.innerHTML = '', 5000);
    }
    
    // Simulate AQI based on weather or city (mock but dynamic)
    async function fetchAQI(lat, lon) {
      try {
        // Using Open-Meteo Air Quality API (free, no key)
        const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi&timezone=auto`;
        const res = await fetch(aqiUrl);
        if(res.ok) {
          const data = await res.json();
          if(data.current && data.current.european_aqi !== undefined) {
            const aqi = data.current.european_aqi;
            let level = '';
            if(aqi <= 20) level = 'Excellent ✨';
            else if(aqi <= 40) level = 'Good 🌿';
            else if(aqi <= 60) level = 'Moderate 🍃';
            else if(aqi <= 80) level = 'Poor ⚠️';
            else level = 'Hazardous 🔥';
            return `${aqi} (${level})`;
          }
        }
        // fallback random based on lat
        const fakeAQI = Math.floor(20 + Math.random() * 40);
        return `${fakeAQI} (Good)`;
      } catch(e) { return '32 (Good)'; }
    }
    
    function mapWeatherCode(code) {
      const codes = {
        0: { desc: "Clear Sky", icon: "fa-sun" }, 1: { desc: "Mainly Clear", icon: "fa-cloud-sun" },
        2: { desc: "Partly Cloudy", icon: "fa-cloud-sun" }, 3: { desc: "Overcast", icon: "fa-cloud" },
        45: { desc: "Fog", icon: "fa-smog" }, 51: { desc: "Drizzle", icon: "fa-cloud-rain" },
        61: { desc: "Rain", icon: "fa-cloud-rain" }, 63: { desc: "Moderate Rain", icon: "fa-cloud-showers-heavy" },
        71: { desc: "Snow", icon: "fa-snowflake" }, 80: { desc: "Showers", icon: "fa-cloud-sun-rain" },
        95: { desc: "Thunderstorm", icon: "fa-bolt" }
      };
      return codes[code] || { desc: "Atmospheric", icon: "fa-cloud-moon" };
    }
    
    function formatDateTime() {
      const now = new Date();
      return now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ' • ' + now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
    }
    
    async function fetchWeatherByCoords(lat, lon, cityName) {
      try {
        const currentUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,windspeed_10m&timezone=auto`;
        const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,windspeed_10m_max&timezone=auto&forecast_days=5`;
        const [currentRes, forecastRes] = await Promise.all([fetch(currentUrl), fetch(forecastUrl)]);
        if (!currentRes.ok || !forecastRes.ok) throw new Error('Weather API failed');
        const currentData = await currentRes.json();
        const forecastData = await forecastRes.json();
        const current = currentData.current_weather;
        const temp = current.temperature;
        const wind = current.windspeed;
        const code = current.weathercode;
        
        let humidity = '--', feelsLike = '--';
        if (currentData.hourly?.relativehumidity_2m) humidity = currentData.hourly.relativehumidity_2m[0] + '%';
        if (currentData.hourly?.apparent_temperature) feelsLike = Math.round(currentData.hourly.apparent_temperature[0]) + '°C';
        else feelsLike = temp + '°C';
        
        const { desc, icon } = mapWeatherCode(code);
        weatherMain.innerHTML = `
          <div class="city-name"><i class="fas fa-map-marker-alt"></i> ${cityName}</div>
          <div class="date-time"><i class="far fa-calendar-alt"></i> ${formatDateTime()}</div>
          <div class="temp-big">${Math.round(temp)}°C</div>
          <div class="weather-desc"><i class="fas ${icon}"></i> ${desc}</div>
          <div class="weather-details">
            <div class="detail-card"><i class="fas fa-temperature-low"></i><div class="detail-label">FEELS LIKE</div><div class="detail-value">${feelsLike}</div></div>
            <div class="detail-card"><i class="fas fa-tint"></i><div class="detail-label">HUMIDITY</div><div class="detail-value">${humidity}</div></div>
            <div class="detail-card"><i class="fas fa-wind"></i><div class="detail-label">WIND</div><div class="detail-value">${Math.round(wind)} km/h</div></div>
          </div>
        `;
        
        // Forecast
        if (forecastData.daily) {
          const daily = forecastData.daily;
          let fcHtml = '';
          for (let i=0; i<Math.min(5, daily.time.length); i++) {
            const d = new Date(daily.time[i]);
            const weekday = d.toLocaleDateString(undefined, { weekday: 'short' });
            const maxT = Math.round(daily.temperature_2m_max[i]);
            const minT = Math.round(daily.temperature_2m_min[i]);
            const { icon: fcIcon } = mapWeatherCode(daily.weathercode[i]);
            fcHtml += `
              <div class="forecast-day">
                <div class="forecast-date">${weekday}<br><span style="font-size:0.65rem;">${d.getDate()}/${d.getMonth()+1}</span></div>
                <div class="forecast-icon"><i class="fas ${fcIcon}"></i></div>
                <div class="forecast-temp">${maxT}° / ${minT}°</div>
              </div>
            `;
          }
          forecastContainer.innerHTML = fcHtml;
        } else forecastContainer.innerHTML = '<div class="error-message">Forecast not available</div>';
        
        // Update AQI dynamically
        const aqiText = await fetchAQI(lat, lon);
        aqiSpan.innerHTML = aqiText;
        
        // Extra global tip (fun fact)
        const tips = ["🌍 Earth's atmosphere protects us!", "💧 71% of Earth is water", "🌀 Strongest storm: Typhoon Tip", "❄️ Coldest: -89°C Antarctica", "🔥 Hottest: 56.7°C Death Valley"];
        const randomTip = tips[Math.floor(Math.random() * tips.length)];
        document.querySelector('.global-tip').innerHTML = `<i class="fas fa-info-circle"></i> ${randomTip}`;
        
      } catch(err) {
        console.error(err);
        showError('Weather data error. Try another city.');
        weatherMain.innerHTML = `<div class="error-message">⚠️ Weather service unavailable</div>`;
      }
    }
    
    async function getCoordinates(city) {
      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        const res = await fetch(geoUrl);
        const data = await res.json();
        if (data.results && data.results.length) {
          const r = data.results[0];
          return { lat: r.latitude, lon: r.longitude, name: `${r.name}, ${r.country || 'Earth'}` };
        }
        throw new Error('City not found');
      } catch(e) {
        showError(`🌎 "${city}" not found. Try a major city.`);
        return null;
      }
    }
    
    async function loadWeather(city) {
      if (!city.trim()) return;
      weatherMain.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Scanning Earth's atmosphere...</div>`;
      forecastContainer.innerHTML = '';
      const coords = await getCoordinates(city.trim());
      if (coords) {
        await fetchWeatherByCoords(coords.lat, coords.lon, coords.name);
      } else {
        weatherMain.innerHTML = `<div class="error-message"><i class="fas fa-globe-americas"></i> Location not recognized</div>`;
      }
    }
    
    // Event listeners
    searchBtn.addEventListener('click', () => loadWeather(cityInput.value));
    cityInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') loadWeather(cityInput.value); });
    
    // Default load: Tokyo for amazing demo
    loadWeather('Tokyo');
    
    // Live clock update every second
    setInterval(() => {
      const dateElem = document.querySelector('.date-time');
      if(dateElem && weatherMain.innerHTML.includes('city-name')) {
        dateElem.innerHTML = `<i class="far fa-calendar-alt"></i> ${formatDateTime()}`;
      }
    }, 1000);
    
    // Additional feature: Random aurora effect on earth? Not needed but extra magic: small particle ring
    const ringGeo = new THREE.TorusGeometry(1.18, 0.008, 128, 400);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x2266aa, transparent: true, opacity: 0.4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);
    
    function animateRing() {
      ring.rotation.x = Math.sin(Date.now() * 0.0005) * 0.5;
      ring.rotation.z = Date.now() * 0.0003;
      requestAnimationFrame(animateRing);
    }
    animateRing();
  </script>
</body>
</html>
